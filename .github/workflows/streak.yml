name: Atualizar streak

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/streak.yml"

jobs:
  gerar-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gerar SVG do streak
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=jonuffykk&hide_border=true&background=0D1117&stroke=2D3748&ring=00E5FF&fire=00E5FF&currStreakNum=FFFFFF&sideNums=FFFFFF&currStreakLabel=00E5FF&sideLabels=FEFEFE&dates=9E9E9E
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "chore: atualizar streak" || exit 0
          git push
