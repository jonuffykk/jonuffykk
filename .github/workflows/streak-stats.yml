name: Atualizar streak

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/streak.yml'

jobs:
  gerar-streak:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Gerar SVG do streak
        uses: DenverCoder1/github-readme-streak-stats@v2
        with:
          user_id: jonuffykk
          theme: react-dark
          background: '0D1117'
          ring: '00E5FF'
          fire: '00E5FF'
          currStreakLabel: '00E5FF'
          hide_border: 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Mover SVG para a pasta profile
        run: |
          mkdir -p profile
          mv github-streak-stats.svg profile/streak.svg

      - name: Commitar atualização
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git diff --staged --quiet || git commit -m "chore: atualizar streak"
          git push
